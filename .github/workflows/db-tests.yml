name: DB tests

# Quota, ledger, ownership, idempotency and recruiter-save regressions against
# a disposable local Supabase stack on the runner (Postgres 17 + PostgREST +
# GoTrue + Storage). No secrets, no production endpoints: the stack listens on
# 127.0.0.1 with the CLI's built-in demo keys, and every suite refuses a
# non-local URL. Reproduce locally with scripts/ci/db-stack.sh + db-tests.sh.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  db:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.98.2

      - name: Start local Supabase stack
        run: scripts/ci/db-stack.sh "$RUNNER_TEMP/db"

      - name: Run database suites
        run: scripts/ci/db-tests.sh "$RUNNER_TEMP/db"

      - name: Upload suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-test-logs
          path: ${{ runner.temp }}/db/logs
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}/db
        run: supabase stop --no-backup || true
