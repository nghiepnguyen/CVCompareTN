name: Supabase Keep-Alive

on:
  schedule:
    # Mỗi ngày 06:00 UTC — thấp hơn nhiều ngưỡng pause 7 ngày của Supabase Free
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /tmp/ping.json -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          if [ "${code}" -ge 400 ]; then
            echo "Body:"; cat /tmp/ping.json
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
